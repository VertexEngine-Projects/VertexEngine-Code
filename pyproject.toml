[project]
name = "VertexEngine"
version = "1.9.4"
description = "A high-performance SDK for Python Development."
authors = [
  { name = "Tyrel Miguel", email = "annbasilan0828@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
  "PyQt6>=6.7",
  "pygame>=2.6; python_version < '3.14'",
  "pygame-ce>=2.5.0; python_version >= '3.14'"
]

keywords = [
  "gamedev", 
  "game-development", 
  "game-engine", 
  "pyqt6", 
  "pygame", 
  "pygame-ce", 
  "sdk", 
  "gui"
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Games/Entertainment",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://vertexengine-zii6.onrender.com"
Documentation = "https://vertexenginedocs.netlify.app"
Tutorials = "https://www.youtube.com/watch?v=-P4t6UabuDU&t=0s"
"Official Tech Site" = "https://tyrel.onrender.com"
Source = "https://github.com/VertexEngine-Projects/VertexEngine-Code"
Issues = "https://github.com/VertexEngine-Projects/VertexEngine-Code/issues"
Discord = "https://discord.gg/jqG8kQjX"

[tool.setuptools]
# Instructs setuptools to bundle non-python data assets
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Tells setuptools to look inside src/VertexEngine for these asset types
"*" = ["*.json", "*.txt", "*.png", "*.jpg", "*.wav", "*.ogg", "*.mp3"]